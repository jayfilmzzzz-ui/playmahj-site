<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

</head><body data-kind="meet">
<header class="top"><div class="wrap"><a class="brand" href="/"><img src="/assets/mark.png" alt="" width="50" height="40">Play Mahj</a><nav class="main" aria-label="Site"><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a><a href="/support/">Support</a></nav></div></header>
<main><div class="wrap">
<article class="doc"><div class="card" id="preview" aria-live="polite" aria-busy="true"><p class="meta">Loading…</p></div>
<p class="note">This meet was shared from Play Mahj, an iPhone app for in-person mahjong meets. If you have the app, open it to see more. Play Mahj is not on the App Store yet. <a href="/">About Play Mahj</a></p></article>
</div></main>
<footer class="end"><div class="wrap"><span>Play Mahj, Miami, Florida</span><span><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a><a href="/host-terms/">Host terms</a><a href="/waiver/">Waiver</a><a href="/support/">Support</a></span></div></footer>
<script>
(function(){
 var kind=document.body.getAttribute("data-kind"),box=document.getElementById("preview"),id=new URLSearchParams(location.search).get("id")||"";
 function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
 function show(nodes){box.replaceChildren.apply(box,nodes);box.removeAttribute("aria-busy")}
 function gone(){show([el("h2",null,kind==="post"?"This post is no longer available":"This meet is no longer available"),el("p","meta",kind==="post"?"It may have been deleted, or its page is not public right now.":"It may have been cancelled, it may have started already, or it is invite-only.")])}
 if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)){gone();return}
 fetch("https://bdymisrejylsplforaqr.supabase.co/functions/v1/pm-share-preview?kind="+kind+"&id="+encodeURIComponent(id.toLowerCase()),{headers:{accept:"application/json"}}).then(function(r){
  if(r.status===404){gone();return null}
  if(!r.ok)throw new Error("http");
  return r.json()
 }).then(function(d){
  if(!d)return;
  if(kind==="post"){
   var who=el("div","who");who.append(el("span",null,String(d.page||"A page")),el("span","seal","\u2713 verified page"));
   var out=[who,el("p","what",String(d.text||""))];
   if(d.posted){var t=new Date(d.posted);if(!isNaN(t))out.push(el("p","meta","Posted "+t.toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})))}
   show(out);document.title=String(d.page||"A post")+" on Play Mahj";
  }else{
   var rows=[el("h2",null,String(d.title||"Mahjong meet"))];
   if(d.when){var w=new Date(d.when);if(!isNaN(w))rows.push(el("p","what",w.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"})+" at "+w.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})))}
   if(d.place)rows.push(el("p","meta",String(d.place)));
   if(d.host)rows.push(el("p","meta","Hosted by "+String(d.host)));
   show(rows);document.title=String(d.title||"A meet")+" on Play Mahj";
  }
 }).catch(function(){show([el("h2",null,"This couldn\u2019t be loaded"),el("p","meta","Check your connection and open the link again.")])});
})();
</script></body></html>
